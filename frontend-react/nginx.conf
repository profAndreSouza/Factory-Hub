server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Suporte para roteamento do React Router (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # All browser API traffic goes through the Java backend. Flask stays private.
    location /api/ {
        # Resolve Docker service names at request time so backend recreation does
        # not leave Nginx pointing at an old container IP until it restarts.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream backend-java:8080;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 35s;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

