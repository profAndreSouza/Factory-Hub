spring:
  application:
    name: factoryhub-backend
  profiles:
    default: mock
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

factoryhub:
  ml:
    base-url: ${ML_SERVICE_BASE_URL:http://localhost:5000}
  influx:
    url: ${INFLUXDB_URL:http://localhost:8086}
    org: ${INFLUXDB_ORG:factoryhub}
    bucket: ${INFLUXDB_BUCKET:telemetry}
    token: ${INFLUXDB_TOKEN:}
  consolidation:
    cron: ${FACTORYHUB_CONSOLIDATION_CRON:0 */5 * * * *}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    br.com.factoryhub: INFO
