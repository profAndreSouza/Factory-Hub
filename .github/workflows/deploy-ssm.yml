name: Build and conditionally publish through SSM

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '- dockerhub publish')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish Flask image
        uses: docker/build-push-action@v6
        with:
          context: ./ml-service
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/factoryhub-ml-service:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/factoryhub-ml-service:sha-${{ github.sha }}

      - name: Publish Java backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend-java
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/factoryhub-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/factoryhub-backend:sha-${{ github.sha }}

      - name: Publish React frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend-react
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/factoryhub-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/factoryhub-frontend:sha-${{ github.sha }}

  deploy:
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
      contains(github.event.head_commit.message, '- dockerhub publish') &&
      vars.SSM_DEPLOY_ENABLED == 'true'))
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Send deploy command through Systems Manager
        env:
          IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && 'latest' || format('sha-{0}', github.sha) }}
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
        run: |
          deployment_command=$(cat <<'REMOTE_SCRIPT'
          set -euo pipefail
          cd /opt/factoryhub
          if ! command -v aws >/dev/null 2>&1; then dnf install -y awscli-2; fi
          git fetch origin main
          git reset --hard origin/main
          rds_prefix=/factoryhub/academy/rds
          rds_host=$(aws ssm get-parameter --name "$rds_prefix/host" --query 'Parameter.Value' --output text --region __AWS_REGION__)
          rds_database=$(aws ssm get-parameter --name "$rds_prefix/database" --query 'Parameter.Value' --output text --region __AWS_REGION__)
          rds_username=$(aws ssm get-parameter --name "$rds_prefix/username" --query 'Parameter.Value' --output text --region __AWS_REGION__)
          rds_password=$(aws ssm get-parameter --name "$rds_prefix/password" --with-decryption --query 'Parameter.Value' --output text --region __AWS_REGION__)
          env_file=/opt/factoryhub/.env
          temp_env=$(mktemp)
          grep -Ev '^(RDS_HOST|RDS_DATABASE|RDS_USERNAME|RDS_PASSWORD)=' "$env_file" > "$temp_env" || true
          printf 'RDS_HOST=%s\nRDS_DATABASE=%s\nRDS_USERNAME=%s\nRDS_PASSWORD=%s\n' \
            "$rds_host" "$rds_database" "$rds_username" "$rds_password" >> "$temp_env"
          chown ec2-user:ec2-user "$temp_env"
          chmod 600 "$temp_env"
          mv "$temp_env" "$env_file"
          IMAGE_TAG=__IMAGE_TAG__ docker compose -f docker-compose.cloud.yml pull
          IMAGE_TAG=__IMAGE_TAG__ docker compose -f docker-compose.cloud.yml up -d --remove-orphans
          REMOTE_SCRIPT
          )
          deployment_command=${deployment_command//__AWS_REGION__/$AWS_REGION}
          deployment_command=${deployment_command//__IMAGE_TAG__/$IMAGE_TAG}
          parameters=$(jq -cn --arg command "$deployment_command" '{commands:[$command]}')
          command_id=$(aws ssm send-command \
            --targets 'Key=tag:Project,Values=factoryhub' \
            --document-name 'AWS-RunShellScript' \
            --comment "Factory Hub deploy ${GITHUB_SHA}" \
            --parameters "$parameters" \
            --query 'Command.CommandId' --output text)

          for attempt in $(seq 1 36); do
            status=$(aws ssm list-command-invocations \
              --command-id "$command_id" \
              --details \
              --query 'CommandInvocations[0].Status' \
              --output text)
            echo "SSM deployment status: ${status}"
            case "$status" in
              Success) exit 0 ;;
              Failed|Cancelled|TimedOut|Undeliverable|Terminated) exit 1 ;;
            esac
            sleep 10
          done
          echo "Timed out waiting for SSM Run Command ${command_id}"
          exit 1
