name: Deploy through SSM

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Send deploy command through Systems Manager
        env:
          IMAGE_TAG: latest
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          deployment_command=$(cat <<'REMOTE_SCRIPT'
          set -euo pipefail
          if ! command -v aws >/dev/null 2>&1 || ! command -v docker >/dev/null 2>&1 || ! command -v git >/dev/null 2>&1; then
            dnf install -y awscli-2 docker git
          fi
          if ! command -v curl >/dev/null 2>&1; then
            dnf install -y curl-minimal
          fi
          systemctl enable --now docker
          if ! docker compose version >/dev/null 2>&1; then
            install -d /usr/local/lib/docker/cli-plugins
            curl --fail --location --retry 5 \
              https://github.com/docker/compose/releases/latest/download/docker-compose-linux-x86_64 \
              --output /usr/local/lib/docker/cli-plugins/docker-compose
            chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
          fi
          app_dir=/opt/factoryhub
          install -d "$app_dir"
          if [ ! -d "$app_dir/.git" ]; then
            if [ -n "$(ls -A "$app_dir")" ]; then
              echo "/opt/factoryhub exists but is not an empty clone directory."
              exit 1
            fi
            git clone --depth 1 "https://github.com/__GITHUB_REPOSITORY__.git" "$app_dir"
          fi
          cd "$app_dir"
          git fetch origin main
          git reset --hard origin/main
          rds_prefix=/factoryhub/academy/rds
          runtime_prefix=/factoryhub/academy/runtime
          dockerhub_username=$(aws ssm get-parameter --name "$runtime_prefix/dockerhub-username" --query 'Parameter.Value' --output text --region __AWS_REGION__)
          influx_org=$(aws ssm get-parameter --name "$runtime_prefix/influx-org" --query 'Parameter.Value' --output text --region __AWS_REGION__)
          influx_bucket=$(aws ssm get-parameter --name "$runtime_prefix/influx-bucket" --query 'Parameter.Value' --output text --region __AWS_REGION__)
          influx_seed_days=$(aws ssm get-parameter --name "$runtime_prefix/influx-seed-days" --query 'Parameter.Value' --output text --region __AWS_REGION__)
          influx_token=$(aws ssm get-parameter --name "$runtime_prefix/influx-token" --with-decryption --query 'Parameter.Value' --output text --region __AWS_REGION__)
          influx_password=$(aws ssm get-parameter --name "$runtime_prefix/influx-password" --with-decryption --query 'Parameter.Value' --output text --region __AWS_REGION__)
          rds_host=$(aws ssm get-parameter --name "$rds_prefix/host" --query 'Parameter.Value' --output text --region __AWS_REGION__)
          rds_database=$(aws ssm get-parameter --name "$rds_prefix/database" --query 'Parameter.Value' --output text --region __AWS_REGION__)
          rds_username=$(aws ssm get-parameter --name "$rds_prefix/username" --query 'Parameter.Value' --output text --region __AWS_REGION__)
          rds_password=$(aws ssm get-parameter --name "$rds_prefix/password" --with-decryption --query 'Parameter.Value' --output text --region __AWS_REGION__)
          env_file="$app_dir/.env"
          temp_env=$(mktemp)
          cat > "$temp_env" <<ENV_FILE
          DOCKERHUB_USERNAME=$dockerhub_username
          IMAGE_TAG=latest
          INFLUXDB_ORG=$influx_org
          INFLUXDB_BUCKET=$influx_bucket
          INFLUXDB_SEED_DAYS=$influx_seed_days
          INFLUXDB_TOKEN=$influx_token
          INFLUXDB_PASSWORD=$influx_password
          RDS_HOST=$rds_host
          RDS_DATABASE=$rds_database
          RDS_USERNAME=$rds_username
          RDS_PASSWORD=$rds_password
          ENV_FILE
          chmod 600 "$temp_env"
          mv "$temp_env" "$env_file"
          IMAGE_TAG=__IMAGE_TAG__ docker compose --env-file "$env_file" -f docker-compose.cloud.yml pull
          IMAGE_TAG=__IMAGE_TAG__ docker compose --env-file "$env_file" -f docker-compose.cloud.yml up -d --remove-orphans
          REMOTE_SCRIPT
          )
          deployment_command=${deployment_command//__AWS_REGION__/$AWS_REGION}
          deployment_command=${deployment_command//__IMAGE_TAG__/$IMAGE_TAG}
          deployment_command=${deployment_command//__GITHUB_REPOSITORY__/$GITHUB_REPOSITORY}
          parameters=$(jq -cn --arg command "$deployment_command" '{commands:[$command]}')
          command_id=$(aws ssm send-command \
            --targets 'Key=tag:Project,Values=factoryhub' \
            --document-name 'AWS-RunShellScript' \
            --comment "Factory Hub deploy ${GITHUB_SHA}" \
            --parameters "$parameters" \
            --query 'Command.CommandId' --output text)

          for attempt in $(seq 1 36); do
            status=$(aws ssm list-command-invocations \
              --command-id "$command_id" \
              --details \
              --query 'CommandInvocations[0].Status' \
              --output text)
            echo "SSM deployment status: ${status}"
            case "$status" in
              Success) exit 0 ;;
              Failed|Cancelled|TimedOut|Undeliverable|Terminated)
                echo "Remote SSM error output:"
                aws ssm get-command-invocation \
                  --command-id "$command_id" \
                  --instance-id "$(aws ssm list-command-invocations --command-id "$command_id" --details --query 'CommandInvocations[0].InstanceId' --output text)" \
                  --query StandardErrorContent --output text || true
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "Timed out waiting for SSM Run Command ${command_id}"
          exit 1
