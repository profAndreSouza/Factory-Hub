name: Publish images to Docker Hub

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-gates:
    name: Required quality gates
    uses: ./.github/workflows/quality-gates.yml

  publish:
    name: Build and publish images
    needs: quality-gates
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish Flask image
        uses: docker/build-push-action@v6
        with:
          context: ./ml-service
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/factoryhub-ml-service:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/factoryhub-ml-service:sha-${{ github.sha }}

      - name: Publish Java backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend-java
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/factoryhub-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/factoryhub-backend:sha-${{ github.sha }}

      - name: Publish React frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend-react
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/factoryhub-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/factoryhub-frontend:sha-${{ github.sha }}
