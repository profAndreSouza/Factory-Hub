name: Publish images to Docker Hub

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-gates:
    name: Required quality gates
    uses: ./.github/workflows/quality-gates.yml

  publish:
    name: Build and publish images
    needs: quality-gates
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish Flask image
        uses: docker/build-push-action@v6
        with:
          context: ./ml-service
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/factoryhub-ml-service:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/factoryhub-ml-service:sha-${{ github.sha }}

      - name: Publish Java backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend-java
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/factoryhub-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/factoryhub-backend:sha-${{ github.sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Build static frontend
        working-directory: frontend-react
        run: |
          npm ci
          npm run build

      - name: Publish frontend to private S3 origin
        run: aws s3 sync frontend-react/dist/ "s3://${{ vars.FRONTEND_BUCKET_NAME }}/" --delete

      - name: Invalidate CloudFront frontend cache
        run: aws cloudfront create-invalidation --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" --paths '/*'
