name: Provisionar infraestrutura AWS

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: factoryhub-terraform
  cancel-in-progress: false

jobs:
  terraform:
    name: Terraform plan e apply
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_ec2_instance_profile_name: ${{ vars.EC2_INSTANCE_PROFILE_NAME }}
      TF_VAR_iot_sqs_role_arn: ${{ vars.IOT_SQS_ROLE_ARN }}
      TF_VAR_lambda_execution_role_arn: ${{ vars.LAMBDA_EXECUTION_ROLE_ARN }}
      TF_VAR_dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required repository configuration
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          EC2_INSTANCE_PROFILE_NAME: ${{ vars.EC2_INSTANCE_PROFILE_NAME }}
          IOT_SQS_ROLE_ARN: ${{ vars.IOT_SQS_ROLE_ARN }}
          LAMBDA_EXECUTION_ROLE_ARN: ${{ vars.LAMBDA_EXECUTION_ROLE_ARN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: |
          set -euo pipefail
          for name in TF_STATE_BUCKET AWS_REGION EC2_INSTANCE_PROFILE_NAME IOT_SQS_ROLE_ARN LAMBDA_EXECUTION_ROLE_ARN DOCKERHUB_USERNAME AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub variable/secret: ${name}"
              exit 1
            fi
          done

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: Verify AWS session
        run: aws sts get-caller-identity

      - name: Verify remote state bucket
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail
          if ! aws s3api head-bucket --bucket "$TF_STATE_BUCKET"; then
            echo "The state bucket is missing or inaccessible to these AWS credentials."
            exit 1
          fi
          versioning=$(aws s3api get-bucket-versioning \
            --bucket "$TF_STATE_BUCKET" \
            --query 'Status' --output text)
          if [ "$versioning" != "Enabled" ]; then
            echo "Enable versioning on the Terraform state bucket before provisioning."
            exit 1
          fi

      - name: Initialize remote state
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=factoryhub/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Validate configuration
        run: terraform validate -no-color

      - name: Create execution plan
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Apply reviewed plan
        run: terraform apply -input=false -no-color -auto-approve tfplan
