name: Quality gates

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flask-tests:
    name: Flask unit and integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml-service/requirements.txt
      - name: Install service and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ml-service/requirements.txt pytest
      - name: Run tests
        working-directory: ml-service
        run: pytest -q

  java-tests:
    name: Java backend API integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend-java/pom.xml
      - name: Run Maven verification
        working-directory: backend-java
        run: mvn --batch-mode --no-transfer-progress verify

  lambda-tests:
    name: SQS Lambda unit and integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test runner
        run: python -m pip install pytest
      - name: Run tests
        run: python -m pytest -q tests/lambda

  frontend-tests:
    name: React unit tests and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  e2e-tests:
    name: Browser end-to-end tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run browser tests
        run: npm run test:e2e
        env:
          CI: 'true'
