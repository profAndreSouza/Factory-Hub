services:
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    image: factoryhub-ml-service:e2e
    environment:
      ML_TRAINING_SOURCE: mock
      ML_MODEL_PATH: /tmp/factoryhub-e2e-model.joblib
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      start_period: 60s
      retries: 24

  backend-java:
    build:
      context: ./backend-java
      dockerfile: Dockerfile
    image: factoryhub-backend:e2e
    environment:
      SPRING_PROFILES_ACTIVE: mock,offline
      SERVER_PORT: 8080
      ML_SERVICE_BASE_URL: http://ml-service:5000
    depends_on:
      ml-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/actuator/health || exit 1"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 24

  frontend:
    build:
      context: ./frontend-react
      dockerfile: Dockerfile
    image: factoryhub-frontend:e2e
    ports:
      - "4173:80"
    depends_on:
      backend-java:
        condition: service_healthy
